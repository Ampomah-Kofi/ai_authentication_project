<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">AI Authentication Study Flow</title>
  <desc id="desc">Diagram showing random assignment into fresh and chained authentication conditions, followed by the same AI permission screen, recall check, debrief, and Qualtrics survey.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/>
    </marker>
    <style>
      .bg{fill:#f7f9fc;}
      .title{font:700 28px Segoe UI,Arial,sans-serif;fill:#182230;}
      .subtitle{font:400 16px Segoe UI,Arial,sans-serif;fill:#5b6472;}
      .label{font:700 19px Segoe UI,Arial,sans-serif;fill:#182230;}
      .small{font:500 14px Segoe UI,Arial,sans-serif;fill:#495566;}
      .boxText{font:700 20px Segoe UI,Arial,sans-serif;fill:#fff;}
      .boxSub{font:500 14px Segoe UI,Arial,sans-serif;fill:#eef6ff;}
      .darkText{font:700 20px Segoe UI,Arial,sans-serif;fill:#243041;}
      .darkSub{font:500 14px Segoe UI,Arial,sans-serif;fill:#4f5e72;}
      .arrow{stroke:#5b6472;stroke-width:2.5;fill:none;marker-end:url(#arrow);}
      .loop{stroke:#8a4f18;stroke-width:2.3;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow);}
      .track{stroke:#0f766e;stroke-width:2;fill:none;stroke-dasharray:5 6;marker-end:url(#arrow);}
      .note{fill:#ffffff;stroke:#d7dde8;stroke-width:1.4;}
    </style>
  </defs>

  <rect class="bg" width="1200" height="860"/>
  <text class="title" x="600" y="48" text-anchor="middle">AI Authentication and Permission Review Study</text>
  <text class="subtitle" x="600" y="76" text-anchor="middle">Behavioral task for usable security and privacy research in the AI era</text>

  <!-- Top consent -->
  <rect x="390" y="105" width="420" height="82" rx="16" fill="#334155"/>
  <text class="boxText" x="600" y="140" text-anchor="middle">Intro and Research Consent</text>
  <text class="boxSub" x="600" y="164" text-anchor="middle">Behavioral tracking disclosed</text>

  <!-- Random assignment diamond -->
  <path d="M600 220 L730 282 L600 344 L470 282 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="darkText" x="600" y="276" text-anchor="middle">Random</text>
  <text class="darkText" x="600" y="302" text-anchor="middle">Assignment</text>

  <path class="arrow" d="M600 187 L600 218"/>

  <!-- Group labels -->
  <text class="label" x="250" y="255" text-anchor="middle">Group A: Fresh</text>
  <text class="small" x="250" y="278" text-anchor="middle">No prior sign-in chain</text>
  <text class="label" x="950" y="255" text-anchor="middle">Group B: Chained</text>
  <text class="small" x="950" y="278" text-anchor="middle">Authentication steps first</text>

  <!-- Group A path -->
  <rect x="80" y="330" width="340" height="92" rx="14" fill="#155a9c"/>
  <text class="boxText" x="250" y="368" text-anchor="middle">Straight to Consent</text>
  <text class="boxSub" x="250" y="394" text-anchor="middle">Fresh permission review condition</text>

  <!-- Group B path -->
  <rect x="780" y="315" width="340" height="78" rx="14" fill="#8a3218"/>
  <text class="boxText" x="950" y="364" text-anchor="middle">Sign-in Choice</text>

  <rect x="780" y="425" width="340" height="78" rx="14" fill="#8a3218"/>
  <text class="boxText" x="950" y="457" text-anchor="middle">Provider Handoff</text>
  <text class="boxSub" x="950" y="481" text-anchor="middle">Continue or use another account</text>

  <rect x="780" y="535" width="340" height="78" rx="14" fill="#8a3218"/>
  <text class="boxText" x="950" y="567" text-anchor="middle">MFA Verification</text>
  <text class="boxSub" x="950" y="591" text-anchor="middle">Approve or deny</text>

  <!-- Main consent -->
  <rect x="390" y="520" width="420" height="102" rx="16" fill="#9a5b00"/>
  <text class="boxText" x="600" y="558" text-anchor="middle">AI Permission / Consent Screen</text>
  <text class="boxSub" x="600" y="584" text-anchor="middle">TaskFlow AI Assistant</text>
  <text class="boxSub" x="600" y="606" text-anchor="middle">Broad planted permission below visible fold</text>

  <!-- Recall and end -->
  <rect x="390" y="670" width="420" height="82" rx="16" fill="#0f766e"/>
  <text class="boxText" x="600" y="704" text-anchor="middle">Recall Check</text>
  <text class="boxSub" x="600" y="730" text-anchor="middle">What permissions were remembered?</text>

  <rect x="390" y="785" width="260" height="58" rx="14" fill="#475569"/>
  <text class="boxText" x="520" y="822" text-anchor="middle">Code and Debrief</text>

  <rect x="760" y="785" width="280" height="58" rx="14" fill="#4f46e5"/>
  <text class="boxText" x="900" y="810" text-anchor="middle">Qualtrics Survey</text>
  <text class="boxSub" x="900" y="832" text-anchor="middle">PID passed in URL</text>

  <!-- Arrows -->
  <path class="arrow" d="M470 282 C390 282 330 292 278 326"/>
  <path class="arrow" d="M730 282 C795 282 865 292 920 313"/>
  <path class="arrow" d="M950 393 L950 423"/>
  <path class="arrow" d="M950 503 L950 533"/>
  <path class="arrow" d="M250 422 L250 571 L387 571"/>
  <path class="arrow" d="M950 613 L950 646 L835 646 L835 571 L813 571"/>
  <path class="arrow" d="M600 622 L600 668"/>
  <path class="arrow" d="M600 752 L560 783"/>
  <path class="arrow" d="M650 814 L758 814"/>

  <!-- Realism loops -->
  <path class="loop" d="M780 463 C710 463 700 354 777 354"/>
  <text class="small" x="690" y="424" text-anchor="middle">Use another account</text>
  <path class="loop" d="M780 574 C695 574 690 354 777 354"/>
  <text class="small" x="690" y="553" text-anchor="middle">Deny</text>

  <!-- Tracking note -->
  <rect class="note" x="60" y="650" width="270" height="150" rx="14"/>
  <text class="darkText" x="195" y="682" text-anchor="middle">Tracked Measures</text>
  <text class="small" x="85" y="713">- Condition and sign-in choice</text>
  <text class="small" x="85" y="738">- Screen time and click sequence</text>
  <text class="small" x="85" y="763">- Scrolling behavior</text>
  <text class="small" x="85" y="788">- Planted permission seen/not seen</text>
  <text class="small" x="85" y="813">- Decision, recall, abandonment</text>
  <path class="track" d="M330 724 C365 704 370 640 390 604"/>
</svg>
