name: Code quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show PHP version
        run: php --version

      - name: Lint PHP
        run: find api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check public configuration JavaScript
        run: node --check study-config.js

      - name: Check inline application JavaScript
        run: node scripts/check-inline-js.mjs

      - name: Reject accidentally committed private files
        run: |
          if find . -path './.git' -prune -o \( -name '.env' -o -name '*.log' -o -name '*.sql.gz' \) -print | grep -q .; then
            echo 'A private environment, log, or database-export file is present.'
            exit 1
          fi
